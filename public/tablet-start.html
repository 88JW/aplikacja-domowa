<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#39734b" />
    <title>HomeApp — tablet</title>
    <link rel="icon" href="/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
        color: #1d2a20;
        background: #f4f7f2;
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: min(100%, 32rem); text-align: center; }
      img { width: 5rem; height: 5rem; }
      h1 { margin: 1rem 0 0.5rem; font-size: 2rem; }
      p { color: #657268; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 1rem;
        border-radius: 999px;
        padding: 0.85rem 1.25rem;
        color: #fff;
        background: #39734b;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>HomeApp</h1>
      <p>Stabilny tryb dla tabletu Huawei. Otwiera ekran lodówkowy bez instalowania WebAPK.</p>
      <a href="/tablet">Otwórz tryb tabletowy</a>
    </main>
  </body>
</html>
