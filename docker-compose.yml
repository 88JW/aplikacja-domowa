services:
  homeapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: homeapp:local
    container_name: homeapp
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3002:3000"
    networks:
      - supabase
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/manifest.webmanifest
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  supabase:
    name: supabase_default
    external: true
